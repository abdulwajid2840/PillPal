name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Arrange project
        run: |
          mkdir -p app/src/main/java/com/jaby/pillpal
          cp MainActivity.kt app/src/main/java/com/jaby/pillpal/
          cp AndroidManifest.xml app/src/main/
          cp app.gradle.kts app/build.gradle.kts
          cp debug.keystore app/debug.keystore
      - name: Build
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build.log
      - name: Show errors
        if: failure()
        run: |
          grep -E "^e: " build.log | head -20 | while read -r l; do echo "::error::$l"; done
      - uses: actions/upload-artifact@v4
        with:
          name: PillPal-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          
